app = "scorehub-relay"
primary_region = "syd"

[build]
  dockerfile = "relay/Dockerfile"

[deploy]
  release_command = "sh -c 'cd /app/packages/db && npx prisma migrate deploy'"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "2s"
  method = "GET"
  path = "/health"
  timeout = "2s"

[env]
  NODE_ENV = "production"
  # Display links must carry their match's token, so "Regenerate display link"
  # on the Outputs tab actually cuts off old links (see relay/src/server.ts).
  DISPLAY_TOKEN_REQUIRED = "true"
  # The display feed is only served to ScoreHub's own pages (ALLOWED_ORIGINS),
  # so third-party graphics software has to use the Data Feed add-on (SA-159).
  DISPLAY_ORIGIN_REQUIRED = "true"
