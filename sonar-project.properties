sonar.projectKey=scorehub
sonar.projectName=ScoreHub
sonar.host.url=https://sonar.samcorp.co.nz

sonar.sources=frontend,relay,bridge,packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/*.d.ts,**/generated/**,**/playwright-report/**,**/playwright-smoke-report/**,**/test-results/**

sonar.test.inclusions=**/__tests__/**,**/e2e/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Generated by `npm run test:coverage` in each workspace (see scripts/sonar-scan.sh).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,relay/coverage/lcov.info,bridge/coverage/lcov.info

sonar.sourceEncoding=UTF-8
