name: Tests

on:
  pull_request:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test-relay:
    name: Relay tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ..
      - run: npm audit --omit=dev --audit-level=high --prefix ..
      - run: npm run build --workspace=@scorehub/db --prefix ..
      - run: npm test -- --ci

  test-bridge:
    name: Bridge (parser) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --ci

  test-frontend:
    name: Frontend build, lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ..
      - run: npm audit --omit=dev --audit-level=high --prefix ..
      - run: npm run build --workspace=@scorehub/db --prefix ..
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_RELAY_URL: https://scorehub-relay.fly.dev

  test-marketing:
    name: Marketing site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  test-help:
    name: Help centre build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: help
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: help/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  # Playwright suite against a full docker-compose stack (postgres/redis/
  # relay/frontend) — see frontend/e2e/playwright.config.ts and CLAUDE.md's
  # "no hosted staging" note. It also depends on a real external network
  # call (Stripe test-mode API + CLI) on top of the relay-contention
  # flakiness the suite's own comments already document even without Stripe
  # in the mix.
  #
  # Two tiers (SA-30):
  #   * @critical (frontend/e2e/specs/control-to-display.spec.ts) — the
  #     control -> relay -> display scoring/clock path. This is the tier that
  #     must fail CI on a scoring/clock regression. It runs FIRST and is the
  #     only step that decides whether this job fails.
  #   * everything else (`test:e2e:rest`) — stays informational
  #     (continue-on-error) because billing needs live Stripe test-mode calls.
  #
  # The gate is switched by the repo variable E2E_CRITICAL_GATE (Settings ->
  # Secrets and variables -> Actions -> Variables). Unset/anything but "true"
  # keeps the whole job informational, as it was before SA-30, so the new
  # critical spec can bake in CI before it can block a deploy. Set it to
  # "true" once it has been green for a bake-in period; deploy.yml and
  # deploy-uat.yml both `needs: test`, so from then on a red critical spec
  # blocks the deploy. `npm run test:e2e:full-sports` (the deep per-sport
  # spec) remains on-demand and is not part of this job.
  test-e2e:
    name: E2E (Playwright, docker-compose)
    runs-on: ubuntu-latest
    needs: [test-relay, test-frontend]
    continue-on-error: ${{ vars.E2E_CRITICAL_GATE != 'true' }}
    env:
      AUTH_SECRET: ci-placeholder-secret
      # Test-mode Stripe account only (acct_1Tl1sw... per CLAUDE.md) — named
      # distinctly from any live-key secret so it's structurally impossible
      # to wire the live key in here by mistake. Unconfigured secrets resolve
      # to empty strings; docker-compose.yml defaults every STRIPE_* var to
      # "" so the stack still boots and every non-billing spec still runs —
      # only billing.spec.ts needs these actually set.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_TEST_PRICE_ID_PRO }}
      STRIPE_PRICE_ID_PRO_ANNUAL: ${{ secrets.STRIPE_TEST_PRICE_ID_PRO_ANNUAL }}
      STRIPE_PRICE_ID_VENUE: ${{ secrets.STRIPE_TEST_PRICE_ID_VENUE }}
      STRIPE_PRICE_ID_VENUE_ANNUAL: ${{ secrets.STRIPE_TEST_PRICE_ID_VENUE_ANNUAL }}
      STRIPE_PRICE_ID_GRAPHICS: ${{ secrets.STRIPE_TEST_PRICE_ID_GRAPHICS }}
      STRIPE_PRICE_ID_GRAPHICS_ANNUAL: ${{ secrets.STRIPE_TEST_PRICE_ID_GRAPHICS_ANNUAL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The specs import @scorehub/db directly (e2e/helpers/billing.ts), so
      # the workspace needs building on the runner host too — the containers
      # only build their own copies.
      - run: npm run build --workspace=packages/db

      - name: Install Stripe CLI
        if: env.STRIPE_SECRET_KEY != ''
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee -a /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe

      # Forwards webhook events to the not-yet-running frontend container —
      # `stripe listen` accepts --forward-to before the target exists and
      # just retries delivery, so starting it before `docker compose up` is
      # fine. Must run (and print its generated signing secret) before the
      # frontend container boots, since STRIPE_WEBHOOK_SECRET has to be in
      # its environment at startup, not injected after the fact.
      - name: Start Stripe webhook forwarding
        if: env.STRIPE_SECRET_KEY != ''
        run: |
          stripe listen --api-key "$STRIPE_SECRET_KEY" --forward-to http://localhost:3000/api/billing/webhook --print-secret > /tmp/whsec.txt &
          sleep 3
          echo "STRIPE_WEBHOOK_SECRET=$(cat /tmp/whsec.txt)" >> "$GITHUB_ENV"

      # docker-compose.yml substitutes NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (and
      # the other STRIPE_* vars) straight from this job's env — no
      # --build-arg needed, same as how NEXT_PUBLIC_RELAY_URL is already
      # wired through.
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the stack to become healthy
        run: |
          timeout 120 sh -c 'until curl -sf http://localhost:3000 && curl -sf http://localhost:4000/health; do sleep 2; done'

      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # DATABASE_URL is step-scoped, not job env: docker-compose.yml
      # interpolates ${DATABASE_URL:-...@postgres:5432/...} from the shell
      # running `docker compose up`, so a job-level localhost value would
      # override the in-container default and point Prisma at the container's
      # own localhost (no Postgres there). Only the Playwright process on the
      # runner host needs it, via the published 5432 port (e2e/helpers/billing.ts).
      - name: E2E critical path (control -> relay -> display)
        run: npm run test:e2e:critical
        env:
          DATABASE_URL: postgresql://scorehub:scorehub@localhost:5432/scorehub

      - name: E2E remaining specs (informational)
        if: always()
        continue-on-error: true
        run: npm run test:e2e:rest
        env:
          DATABASE_URL: postgresql://scorehub:scorehub@localhost:5432/scorehub

      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
