name: SonarQube

# main only. The shared SonarQube is Community edition: one result per
# project, no PR analysis, so a PR scan (Dependabot opens several a day)
# just overwrites main's result with the PR's. Local pre-push scans
# (scripts/sonar-scan.sh) cover work in progress.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: Scan (shared SonarQube)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so SonarQube can do blame-based new-code analysis.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=@scorehub/db

      # Regenerate lcov reports so sonar.javascript.lcov.reportPaths (see
      # sonar-project.properties) has fresh data.
      - run: npm run test:coverage --workspace=frontend
      - run: npm run test:coverage --workspace=relay
      - run: npm run test:coverage --workspace=bridge

      # See scripts/sonar-version.sh — keeps the new-code baseline moving.
      - id: version
        run: echo "value=$(scripts/sonar-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
