name: Deploy

on:
  push:
    branches: [main]
    # A push that only touches the Better Stack Terraform has nothing to
    # deploy here — infra-betterstack.yml plans and applies it. Keep this list
    # in step with test.yml's.
    paths-ignore:
      - "infra/betterstack/**"
      - ".github/workflows/infra-betterstack.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      skip-e2e-rest: true
    # Pushes landing in quick succession each used to run the full suite before
    # cancel-superseded (below) could cancel the older ones. This cancels an
    # older run's tests as soon as a newer push arrives; its deploy jobs are then
    # skipped. Scoped to the test job only — an approved, mid-deploy run is never
    # cancelled (see cancel-superseded for why).
    concurrency:
      group: deploy-tests-${{ github.ref }}
      cancel-in-progress: true

  # A run paused at the production approval gate stays approvable indefinitely,
  # and approving an old one would ship that older commit over a newer deploy.
  # So once this run's tests pass, it cancels every older run still waiting for
  # approval. Only `waiting` runs are touched: one that has been approved and is
  # mid-deploy is left to finish, since cancelling it could leave relay and
  # frontend on different commits (which is why this isn't a workflow-level
  # `concurrency` group with cancel-in-progress).
  cancel-superseded:
    name: Cancel superseded deploy runs
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Cancel older runs still waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=waiting&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER) | .id" |
          while read -r id; do
            echo "Cancelling superseded run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY"
          done

  deploy-relay:
    name: Deploy relay (Fly.io)
    needs: test
    runs-on: ubuntu-24.04
    # Requires manual approval via the "production" GitHub Environment's
    # required reviewers (configure in repo Settings → Environments) before
    # this job is allowed to run, even though it's triggered automatically
    # on every push to main (SA-12).
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy relay to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy frontend to Vercel
        # Built on Vercel, not here with `vercel build` + `--prebuilt`: `vercel
        # pull` returns the literal string "[SENSITIVE]" for Sensitive env
        # vars, and a local build bakes that placeholder into the bundle for
        # every Sensitive NEXT_PUBLIC_* var (Turnstile site key, Sentry DSN,
        # Stripe publishable key).
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Post-deploy smoke test (SA-30) against the LIVE relay and frontend once both
  # deploys (each behind the production reviewer gate) have finished — see
  # scripts/smoke.mjs and docs/smoke-org.md. It can't roll back; it makes a bad
  # deploy loudly red instead of silently live.
  #
  # Unauthenticated checks need no configuration. The authenticated checks
  # (a score change made with a match-pinned CONTROL token must reach a viewer
  # socket AND the rendered display page in a real browser) need the smoke org's
  # credentials: repo variables SMOKE_ORG_ID / SMOKE_MATCH_ID and secrets
  # SMOKE_CONTROL_TOKEN / SMOKE_DISPLAY_TOKEN, created by
  # `npm run smoke:provision --workspace=relay -- --env prod`. Until they exist
  # the authenticated part is SKIPPED (not failed); set the repo variable
  # SMOKE_AUTH_MODE=required once configured so a missing credential fails loudly.
  smoke-test:
    name: Post-deploy smoke test
    needs: [deploy-relay, deploy-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Every run scores +1 then -1 on the one smoke match; two overlapping runs
    # would corrupt each other's baseline, so they queue rather than cancel.
    concurrency:
      group: smoke-prod
      cancel-in-progress: false
    env:
      SMOKE_RELAY_URL: ${{ vars.SMOKE_RELAY_URL || 'https://relay.scorehub.co.nz' }}
      SMOKE_FRONTEND_URL: ${{ vars.SMOKE_FRONTEND_URL || 'https://app.scorehub.co.nz' }}
      SMOKE_AUTH_MODE: ${{ vars.SMOKE_AUTH_MODE || 'optional' }}
      SMOKE_ORG_ID: ${{ vars.SMOKE_ORG_ID }}
      SMOKE_MATCH_ID: ${{ vars.SMOKE_MATCH_ID }}
      SMOKE_CONTROL_TOKEN: ${{ secrets.SMOKE_CONTROL_TOKEN }}
      SMOKE_DISPLAY_TOKEN: ${{ secrets.SMOKE_DISPLAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Relay + frontend smoke checks
        run: node scripts/smoke.mjs --relay "$SMOKE_RELAY_URL" --frontend "$SMOKE_FRONTEND_URL" --expect multi --auth "$SMOKE_AUTH_MODE" --wait 180
      # Deliberately not using test.yml's Playwright browser cache: this job
      # holds production smoke credentials, so it installs a fresh browser
      # rather than running one restored from a cache other jobs can write.
      - name: Install Chromium for the display-page check
        if: env.SMOKE_CONTROL_TOKEN != ''
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Display page renders a live change (real browser)
        if: env.SMOKE_CONTROL_TOKEN != ''
        working-directory: frontend
        run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-smoke-report
          path: frontend/playwright-smoke-report/
          if-no-files-found: ignore
          retention-days: 7

  # The three standalone Cloudflare Workers (marketing site, help centre,
  # downloads redirect) in one job, behind the same production-environment gate
  # as relay/frontend. They were three jobs, each billed a full minute for well
  # under one minute of work. Each site deploys only when something under its
  # folder (or this workflow) changed since the last fully successful deploy
  # run — not since the previous push, since a superseded run that got cancelled
  # never deployed its changes. workflow_dispatch deploys all three.
  deploy-sites:
    name: Deploy marketing, help, downloads (Cloudflare Workers)
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Work out which sites changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          all=false
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable previous deploy (event=$GITHUB_EVENT_NAME, base=${base:-none}); deploying every site"
            all=true
          else
            echo "Diffing against last successful deploy $base"
            changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          for site in marketing help downloads; do
            if [ "$all" = true ] || grep -qE "^($site/|\.github/workflows/deploy\.yml$)" <<<"$changed"; then
              echo "$site: deploying"
              echo "$site=true" >> "$GITHUB_OUTPUT"
            else
              echo "$site: unchanged, skipping"
              echo "$site=false" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            marketing/package-lock.json
            help/package-lock.json
            downloads/package-lock.json
      # `!cancelled()` so one site failing doesn't stop the others deploying,
      # as when they were separate jobs; the job still goes red.
      - name: Deploy marketing site
        if: ${{ !cancelled() && steps.changed.outputs.marketing == 'true' }}
        working-directory: marketing
        run: npm ci && npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy help centre
        if: ${{ !cancelled() && steps.changed.outputs.help == 'true' }}
        working-directory: help
        run: npm ci && npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy downloads redirect
        if: ${{ !cancelled() && steps.changed.outputs.downloads == 'true' }}
        working-directory: downloads
        run: npm ci && npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
