name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-relay:
    name: Deploy relay (Fly.io)
    needs: test
    runs-on: ubuntu-latest
    # Requires manual approval via the "production" GitHub Environment's
    # required reviewers (configure in repo Settings → Environments) before
    # this job is allowed to run, even though it's triggered automatically
    # on every push to main (SA-12).
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Install Fly CLI
        run: curl -L https://fly.io/install.sh | sh
      - name: Deploy relay to Fly.io
        run: $HOME/.fly/bin/flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy frontend to Vercel
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Post-deploy smoke test (SA-30): credential-free checks against the LIVE
  # relay and frontend once both deploys (each behind the production
  # reviewer gate) have finished — see scripts/smoke.mjs. It can't roll back,
  # it makes a bad deploy loudly red instead of silently live. Needs no
  # secrets and no environment approval. Override the URLs with the repo
  # variables SMOKE_RELAY_URL / SMOKE_FRONTEND_URL.
  smoke-test:
    name: Post-deploy smoke test
    needs: [deploy-relay, deploy-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_RELAY_URL: ${{ vars.SMOKE_RELAY_URL || 'https://scorehub-relay.fly.dev' }}
      SMOKE_FRONTEND_URL: ${{ vars.SMOKE_FRONTEND_URL || 'https://app.scorehub.co.nz' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/smoke.mjs --relay "$SMOKE_RELAY_URL" --frontend "$SMOKE_FRONTEND_URL" --expect multi --wait 180

  deploy-marketing:
    name: Deploy marketing site (Cloudflare Worker)
    needs: test
    runs-on: ubuntu-latest
    # Same production-environment gate as relay/frontend above — previously
    # this site deployed manually (`cd marketing && npm run build && npx
    # wrangler deploy`) with no CI and no review step at all.
    environment: production
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-help:
    name: Deploy help centre (Cloudflare Worker)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: help
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: help/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-downloads:
    name: Deploy downloads redirect (Cloudflare Worker)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: downloads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: downloads/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
