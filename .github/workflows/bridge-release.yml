name: Bridge release

# Builds the Electron-wrapped bridge (SA-90) for Mac and Windows and
# publishes both installers as assets on a GitHub Release. Triggered by
# pushing a `bridge-v*` tag — see bridge/README.md for the release process.
# Unsigned installers (SA-91): code signing is a separate follow-up story.
# The Mac app is ad-hoc signed (bridge/package.json `mac.identity: "-"`) so
# Apple Silicon doesn't reject the download as "damaged".
# Running it manually builds both installers without publishing anything.
#
# A `bridge-uat-v*` tag (e.g. bridge-uat-v0.3.2-rc.1, SA-255) builds a UAT
# installer instead — UAT relay by default, separate app name, version taken
# from the tag — and publishes it as a GitHub *pre-release*, which only
# downloads.uat.scorehub.co.nz serves. `bridge-v*` doesn't match those tags,
# and the production Worker and in-app update check skip pre-releases.
on:
  push:
    tags:
      - "bridge-v*"
      - "bridge-uat-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS installer
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Configure UAT build
        if: startsWith(github.ref, 'refs/tags/bridge-uat-v')
        run: node scripts/set-release-channel.js uat "${REF_NAME#bridge-uat-v}"
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bridge-mac
          path: bridge/release/*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Configure UAT build
        if: startsWith(github.ref, 'refs/tags/bridge-uat-v')
        run: node scripts/set-release-channel.js uat "${REF_NAME#bridge-uat-v}"
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
      - run: npm run dist:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bridge-win
          path: bridge/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    # A manual run (workflow_dispatch) is a build-only check: without this
    # guard it would publish a release tagged after the branch it ran on.
    if: startsWith(github.ref, 'refs/tags/bridge-v') || startsWith(github.ref, 'refs/tags/bridge-uat-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$REF_NAME" == bridge-uat-v* ]]; then
            # --latest=false keeps the repo's "Latest release" badge on production.
            flags=(--prerelease --latest=false)
          fi
          gh release create "$REF_NAME" \
            artifacts/bridge-mac/*.dmg \
            artifacts/bridge-win/*.exe \
            --repo "$REPO" \
            --title "Bridge $REF_NAME" \
            --generate-notes \
            "${flags[@]}"
