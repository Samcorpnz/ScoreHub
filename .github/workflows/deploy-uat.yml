name: Deploy UAT

on:
  push:
    branches: [uat]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-relay-uat:
    name: Deploy relay (Fly.io UAT)
    needs: test
    runs-on: ubuntu-24.04
    # No required-reviewer gate here (unlike deploy.yml's production environment) —
    # UAT isn't customer-facing, so pushes to `uat` deploy immediately.
    # Two back-to-back pushes otherwise run flyctl deploy against the same app at
    # once; the overlap killed the older run's release_command (prisma migrate
    # deploy) mid-flight. Queue rather than cancel, so a migration is never cut off.
    concurrency:
      group: deploy-relay-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy relay to Fly.io (UAT)
        run: flyctl deploy -c fly.uat.toml -a scorehub-relay-uat --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_UAT }}

  # Post-deploy smoke test (SA-30) — relay only. UAT's frontend deploys via
  # Vercel's own Git integration (no job here to wait on, so a browser check
  # could hit the previous build) and sits behind Cloudflare Zero Trust Access,
  # so the display-page check is prod-only. The relay scales to zero on Fly,
  # hence the long --wait for the first request to wake it.
  #
  # Authenticated checks use the UAT smoke org (variables SMOKE_UAT_ORG_ID /
  # SMOKE_UAT_MATCH_ID, secrets SMOKE_UAT_CONTROL_TOKEN / SMOKE_UAT_DISPLAY_TOKEN,
  # from `npm run smoke:provision --workspace=relay -- --env uat`); skipped until
  # set. Repo variable SMOKE_AUTH_MODE=required makes a missing credential fail.
  smoke-test-uat:
    name: Post-deploy smoke test (UAT relay)
    needs: deploy-relay-uat
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: smoke-uat
      cancel-in-progress: false
    env:
      SMOKE_RELAY_URL: ${{ vars.SMOKE_RELAY_URL_UAT || 'https://relay.uat.scorehub.co.nz' }}
      SMOKE_AUTH_MODE: ${{ vars.SMOKE_AUTH_MODE || 'optional' }}
      SMOKE_ORG_ID: ${{ vars.SMOKE_UAT_ORG_ID }}
      SMOKE_MATCH_ID: ${{ vars.SMOKE_UAT_MATCH_ID }}
      SMOKE_CONTROL_TOKEN: ${{ secrets.SMOKE_UAT_CONTROL_TOKEN }}
      SMOKE_DISPLAY_TOKEN: ${{ secrets.SMOKE_UAT_DISPLAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/smoke.mjs --relay "$SMOKE_RELAY_URL" --expect multi --auth "$SMOKE_AUTH_MODE" --wait 180

  # Help centre (Cloudflare Worker `scorehub-help-uat`, help.uat.scorehub.co.nz).
  # Same steps as deploy.yml's deploy-help, minus the production environment
  # gate. Worker secrets (OPENROUTER_API_KEY, BETTER_STACK_SOURCE_TOKEN) are set
  # once with `wrangler secret put --env uat` and survive deploys.
  deploy-help-uat:
    name: Deploy help centre (Cloudflare Worker UAT)
    needs: test
    # workflow_dispatch can be started from any branch; only ever deploy `uat`.
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-help-uat
      cancel-in-progress: false
    defaults:
      run:
        working-directory: help
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: help/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --env uat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Bridge download redirect (Cloudflare Worker `scorehub-downloads-uat`,
  # downloads.uat.scorehub.co.nz, SA-255). Serves the latest `bridge-uat-v*`
  # pre-release; the custom domain is created by the first deploy. Manual
  # equivalent: `cd downloads && npx wrangler deploy --env uat`.
  deploy-downloads-uat:
    name: Deploy downloads redirect (Cloudflare Worker UAT)
    needs: test
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-downloads-uat
      cancel-in-progress: false
    defaults:
      run:
        working-directory: downloads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: downloads/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --env uat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Frontend needs no job here: Vercel's GitHub integration auto-deploys a
  # preview on every push to any branch, including `uat`, using the
  # branch-scoped env vars set via `vercel env add --git-branch uat` (see
  # docs/uat-environment.md).
