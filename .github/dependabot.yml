version: 2
# Daily checks; version updates go to `uat` and reach `main` with the next
# promotion. The 7-day cooldown keeps a freshly hijacked release out of the
# lockfile. Security updates skip the cooldown but ignore target-branch, so they
# open against `main`. They also cover lockfiles not listed here.
updates:
  - package-ecosystem: npm
    # "/" covers the npm workspace (frontend, relay, bridge, packages/*); the
    # standalone Workers and the Stream Deck plugin have their own lockfiles.
    directories:
      - "/"
      - "/downloads"
      - "/help"
      - "/marketing"
      - "/stream-deck-plugin"
    target-branch: uat
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10
    ignore:
      # ts-jest@29.x (relay's and bridge's test runner) and Next.js 16.2.12's
      # TypeScript integration (frontend's build) don't support TypeScript 7
      # yet. Revisit once those tools ship compatible releases.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - "/frontend"
      - "/relay"
    target-branch: uat
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: uat
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
